[pytest]
# The suites in tests/ are standalone contract checks named `*_check.py`, which
# pytest's default discovery ignores — `pytest -q` used to exit green having run
# nothing. Collect them, but do NOT collect their `main()` directly: `main()`
# signals failure by RETURNING 1, and pytest passes a non-None return with only
# a warning. tests/test_contract_suites.py runs each `main()` and asserts on the
# status, so a failing check turns pytest red.
python_files = *_check.py test_*.py
python_functions = test_*
testpaths = tests
